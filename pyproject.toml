[project]
name = "applybot"
version = "0.1.0"
description = "Tailor a LaTeX CV to a job description, with human review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.6.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "platformdirs>=4.14.7",
    "pydantic>=2",
    "pypdf>=4",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlmodel>=0.0.50",
    "trafilatura>=2.3.1",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
applybot = "applybot.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
