# For running Alembic by hand during development, e.g.
#   uv run alembic current
#   uv run alembic revision --autogenerate -m "describe the change"
# ApplyBot itself runs the migrations in code when it opens the history.
[alembic]
script_location = src/applybot/storage/migrations
file_template = %%(rev)s_%%(slug)s
