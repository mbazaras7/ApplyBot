name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  # Slower check: build the Docker image and compile LaTeX inside it. Runs only on pull
  # requests into master, so every push still gets fast feedback from the job above.
  docker:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: applybot:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compile tests inside the image
        # REQUIRE_LATEX=1: fail, don't skip, if Tectonic is missing. The real-model test
        # in test_cv_index.py runs too, proving the embedding model is baked in.
        run: >
          docker run --rm -e REQUIRE_LATEX=1 applybot:test
          pytest -v tests/test_latex_compiler.py tests/test_pipeline.py tests/test_cv_index.py

      - name: Build the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          tags: applybot:latest
          load: true
          cache-from: type=gha

      - name: The app starts
        run: docker run --rm applybot:latest --help
