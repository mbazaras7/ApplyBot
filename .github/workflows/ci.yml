name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  # Slower check: really compile LaTeX with Tectonic. Runs only on pull requests into
  # master, so every push still gets fast feedback from the job above.
  compile:
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    env:
      TECTONIC_VERSION: "0.17.0"

    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install Tectonic ${{ env.TECTONIC_VERSION }}
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache Tectonic's TeX bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ hashFiles('tests/fixtures/*.tex') }}
          restore-keys: tectonic-${{ env.TECTONIC_VERSION }}-

      - name: Install dependencies
        run: uv sync --locked

      - name: Compile tests
        env:
          REQUIRE_LATEX: "1"  # fail, don't skip, if Tectonic is missing
        run: uv run pytest tests/test_latex_compiler.py -v
